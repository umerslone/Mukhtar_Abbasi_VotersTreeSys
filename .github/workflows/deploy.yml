name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_db_push:
        description: 'Run "prisma db push" (apply schema changes)'
        required: false
        default: 'false'

concurrency:
  group: droplet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: SSH into Droplet and run deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            export RUN_DB_PUSH="${{ inputs.run_db_push == 'true' && '1' || '0' }}"
            cd ~/Mukhtar_Abbasi_VotersTreeSys
            bash infra/droplet/deploy.sh
